# Production profile (SPRING_PROFILES_ACTIVE=cloud on Railway): the application lives in its own
# private `streamguard` schema inside Railway PostgreSQL.
spring:
  datasource:
    hikari:
      schema: streamguard
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    default-schema: streamguard
    schemas: streamguard
    create-schemas: false
    # A database that already holds the V1 and V2 tables without Flyway history starts from V2.
    baseline-on-migrate: true
    baseline-version: 2
    baseline-description: Existing V1 and V2 schema
server:
  forward-headers-strategy: native
app:
  # Free hosts lose local files when they sleep. PostgreSQL retains the clip bytes.
  media-storage: ${MEDIA_STORAGE:database}
