name: Publish backend container

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - pom.xml
      - src/main/**
      - .github/workflows/container-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the production source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the Java and FFmpeg image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/samuelvallejo/streamguard-backend:main
            ghcr.io/samuelvallejo/streamguard-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=StreamGuard Backend
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record the immutable image reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: printf '### Backend image\n\n`ghcr.io/samuelvallejo/streamguard-backend@%s`\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
