name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: streamguard_test
          POSTGRES_USER: streamguard
          POSTGRES_PASSWORD: streamguard
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U streamguard -d streamguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build and test
        run: mvn -B -ntp verify
